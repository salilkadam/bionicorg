{{- if .Values.vault.path }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.vault.secretStore }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server }}
      path: {{ .Values.vault.kvMount }}
      version: v2
      namespace: ""
      # Vault JWT auth (enabled once via deploy/scripts/setup-vault-jwt.sh).
      # ESO mints short-lived Kubernetes SA JWTs through the TokenRequest API
      # and logs into Vault's jwt/ method each time the token nears expiry:
      # no service-account token is mounted and no long-lived secret exists.
      auth:
        jwt:
          path: jwt
          role: {{ .Values.vault.jwtRole }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - vault
            expirationSeconds: 3600
{{- end }}
