{{- if .Values.vault.apiKeysPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vault.apiKeysSecretName }}
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
  annotations:
    force-sync: "{{ now | date "1000000000" }}"
spec:
  # Sync the org-wide shared provider API keys (anthropic, claude subscription,
  # github, openai, gemini, openrouter, ...) into their own K8s secret.
  # Kept separate from {{ include "bionic-org.name" . }}-secrets so app config and
  # provider keys rotate independently and key names never collide.
  dataFrom:
    - extract:
        key: {{ .Values.vault.apiKeysPath }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
    name: {{ .Values.vault.apiKeysSecretName }}
{{- end }}
