{{- /*
  PostgreSQL superuser ExternalSecret.
  Reads the CNPG primary password from the existing pg-superuser secret,
  or from a dedicated source if you create one.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bionic-org.name" . }}-pg-superuser
  namespace: {{ .Values.namespace | default .Release.Name }}
  labels:
    {{- include "bionic-org.labels" . | nindent 4 }}
  annotations:
    force-sync: "{{ now | date "1000000000" }}"
spec:
  # The PG superuser credentials come from the CNPG cluster's superuser secret.
  # If you want per-app credentials, create a dedicated secret in Vault.
  # For now we reuse the CNPG superuser via the existing pattern.
  data:
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.vault.path }}
        property: database_url
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.vault.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.vault.secretStore }}
  target:
    creationPolicy: Owner
    deletionPolicy: {{ .Values.vault.deletionPolicy }}
    name: {{ include "bionic-org.name" . }}-pg-superuser
